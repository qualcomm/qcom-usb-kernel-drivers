name: Windows Driver Analysis

# Runs two complementary static analysis tools on every PR that touches
# Windows driver source code:
#
#   1. Code Analysis (/analyze) — MSBuild-integrated MSVC static analyser.
#      Catches buffer overruns, null dereferences, IRQL violations, and
#      SAL annotation mismatches at compile time.
#
#   2. CodeQL with microsoft/windows-drivers query pack — the official
#      Microsoft-recommended replacement for SDV (deprecated in WDK
#      10.0.26100+ / VS2022). Covers IRQL violations, IRP handling,
#      WDF object lifetime, locking discipline, and memory safety.
#      Results are uploaded to GitHub Security as SARIF.
#
# Static Driver Verifier (SDV) is intentionally excluded — it was removed
# from WDK 10.0.26100+ and is no longer compatible with VS2022 or later.
# Driver Verifier (runtime) is also excluded — it requires a live kernel
# and cannot run in a hosted CI environment.
#
# Only kernel driver projects are analysed. Tool projects (qdinstall,
# qdclr, qdcfg, qcdev, wwansvc) are user-mode executables and are excluded.

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'src/windows/filter/**'
      - 'src/windows/ndis/**'
      - 'src/windows/wdfserial/**'
      - 'src/windows/qdss/**'

permissions:
  contents: read
  security-events: write  # required to upload SARIF results to GitHub Security

jobs:

  # ============================================================
  # Code Analysis (/analyze) — all four driver projects
  # ============================================================
  code-analysis:
    name: Code Analysis — ${{ matrix.project.name }}
    runs-on: windows-2022
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: qcusbfilter (WDM)
            vcxproj: src/windows/filter/qcusbfilter.vcxproj
            driver_type: WDM
          - name: qcusbnet (WDM)
            vcxproj: src/windows/ndis/qcusbnet.vcxproj
            driver_type: WDM
          - name: qcwdfserial (KMDF)
            vcxproj: src/windows/wdfserial/qcwdfserial.vcxproj
            driver_type: KMDF
          - name: qdbusb (KMDF)
            vcxproj: src/windows/qdss/qdbusb.vcxproj
            driver_type: KMDF

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce  # v2

      - name: Install WDK
        shell: pwsh
        run: |
          $wdkUrl       = "https://go.microsoft.com/fwlink/?linkid=2335869"
          $wdkInstaller = "$env:TEMP\wdksetup.exe"
          Write-Host "Downloading WDK..."
          & curl.exe -L --retry 3 --retry-delay 5 -o $wdkInstaller $wdkUrl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item $wdkInstaller).Length -lt 1MB) {
            Write-Host "ERROR: WDK installer download appears corrupt." -ForegroundColor Red; exit 1
          }
          Write-Host "Installing WDK silently..."
          $proc = Start-Process -FilePath $wdkInstaller -ArgumentList "/quiet /norestart" -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            Write-Host "ERROR: WDK installer exited with $($proc.ExitCode)" -ForegroundColor Red
            exit $proc.ExitCode
          }
          Write-Host "WDK installed."

      - name: Run Code Analysis
        shell: pwsh
        run: |
          # /analyze enables MSVC static analysis.
          # RunCodeAnalysis=true tells the WDK targets to enable /analyze.
          # AnalysisStopOnError=true fails the build on any Code Analysis warning.
          msbuild "${{ matrix.project.vcxproj }}" `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RunCodeAnalysis=true `
            /p:AnalysisStopOnError=true `
            /p:EnablePREfast=true `
            /p:CodeAnalysisRuleSet=NativeRecommendedRules.ruleset `
            /p:CA_PlugInDir="$(${env:WindowsSdkDir})\..\..\WDK\CodeAnalysis\Plugins" `
            /t:Build `
            /m `
            /nologo `
            /filelogger `
            /fileloggerparameters:LogFile=ca_${{ matrix.project.driver_type }}.log

      - name: Upload Code Analysis log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: code-analysis-${{ matrix.project.name }}
          path: ca_${{ matrix.project.driver_type }}.log
          retention-days: 14

  # ============================================================
  # CodeQL — microsoft/windows-drivers query pack (SDV replacement)
  # ============================================================
  codeql-driver-analysis:
    name: CodeQL Windows Driver Analysis
    runs-on: windows-2022
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce  # v2

      - name: Install WDK
        shell: pwsh
        run: |
          $wdkUrl       = "https://go.microsoft.com/fwlink/?linkid=2335869"
          $wdkInstaller = "$env:TEMP\wdksetup.exe"
          Write-Host "Downloading WDK..."
          & curl.exe -L --retry 3 --retry-delay 5 -o $wdkInstaller $wdkUrl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item $wdkInstaller).Length -lt 1MB) {
            Write-Host "ERROR: WDK installer download appears corrupt." -ForegroundColor Red; exit 1
          }
          Write-Host "Installing WDK silently..."
          $proc = Start-Process -FilePath $wdkInstaller -ArgumentList "/quiet /norestart" -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            Write-Host "ERROR: WDK installer exited with $($proc.ExitCode)" -ForegroundColor Red
            exit $proc.ExitCode
          }
          Write-Host "WDK installed."

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          languages: cpp
          # Download both packs. The queries field scopes execution to only
          # the mustfix.qls suite, which avoids the example filter queries
          # in microsoft/cpp-queries that depend on extensional predicates
          # (metricResults, defectResults) not available in standard CI.
          packs: microsoft/cpp-queries,microsoft/windows-drivers
          queries: mustfix.qls

      - name: Build all driver projects for CodeQL
        shell: pwsh
        run: |
          # Build all four kernel driver projects under the CodeQL tracer
          # so it captures every compilation unit across all drivers.
          $projects = @(
            "src/windows/filter/qcusbfilter.vcxproj",
            "src/windows/ndis/qcusbnet.vcxproj",
            "src/windows/wdfserial/qcwdfserial.vcxproj",
            "src/windows/qdss/qdbusb.vcxproj"
          )
          foreach ($proj in $projects) {
            Write-Host "Building $proj for CodeQL tracing..."
            msbuild $proj `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /t:Build `
              /m `
              /nologo
            if ($LASTEXITCODE -ne 0) {
              Write-Host "ERROR: Build failed for $proj" -ForegroundColor Red
              exit $LASTEXITCODE
            }
          }

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          category: windows-drivers
          # Findings appear under Security -> Code scanning alerts.
          upload: always
