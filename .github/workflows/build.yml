name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:

  # ============================================================
  # Detect which platform directories changed.
  # Outputs:
  #   run_linux   – true when src/linux/** or scripts/linux/** is touched
  #   run_windows – true when build/** or src/windows/** is touched
  # ============================================================
  detect-changes:
    name: Detect Changed Directories
    runs-on: ubuntu-latest
    outputs:
      run_linux:   ${{ steps.filter.outputs.linux }}
      run_windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            FROM_SHA="$PUSH_BEFORE"
            TO_SHA="$PUSH_AFTER"
            # A new-branch push or force-push can make the before SHA
            # unreachable; fall back to diffing against the parent commit.
            if ! git cat-file -e "${FROM_SHA}^{commit}" 2>/dev/null; then
              FROM_SHA="${TO_SHA}^"
            fi
          else
            FROM_SHA="$BASE_SHA"
            TO_SHA="$HEAD_SHA"
          fi

          CHANGED=$(git diff --name-only "$FROM_SHA" "$TO_SHA")
          echo "Changed files:"
          echo "$CHANGED"

          # Linux: any change under src/linux/ or scripts/linux/
          if echo "$CHANGED" | grep -qE '^(src/linux/|scripts/linux/)'; then
            echo "linux=true"  >> "$GITHUB_OUTPUT"
          else
            echo "linux=false" >> "$GITHUB_OUTPUT"
          fi

          # Windows: any change under build/ or src/windows/
          if echo "$CHANGED" | grep -qE '^(build/|src/windows/)'; then
            echo "windows=true"  >> "$GITHUB_OUTPUT"
          else
            echo "windows=false" >> "$GITHUB_OUTPUT"
          fi

          echo "from_sha=$FROM_SHA" >> "$GITHUB_OUTPUT"
          echo "to_sha=$TO_SHA"     >> "$GITHUB_OUTPUT"

      - name: Guard against an unbumped Linux version on main
        if: >
          steps.filter.outputs.linux == 'true' &&
          (github.event_name == 'push' || github.base_ref == 'main')
        env:
          FROM_SHA: ${{ steps.filter.outputs.from_sha }}
          TO_SHA: ${{ steps.filter.outputs.to_sha }}
        run: |
          OLD_VERSION=$(git show "${FROM_SHA}:src/linux/version.h" \
            | grep -E '^[[:space:]]*#define[[:space:]]+DRIVER_VERSION' \
            | sed -E 's/.*"([^"]+)".*/\1/')
          NEW_VERSION=$(git show "${TO_SHA}:src/linux/version.h" \
            | grep -E '^[[:space:]]*#define[[:space:]]+DRIVER_VERSION' \
            | sed -E 's/.*"([^"]+)".*/\1/')

          if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "::error file=src/linux/version.h::This push to main changes src/linux/ or scripts/linux/, but DRIVER_VERSION is still \"${NEW_VERSION}\" (unchanged). Bump src/linux/version.h and add a matching section to src/linux/RELEASES.md on develop before promoting to main, otherwise no Linux pre-release will be queued for this change."
            exit 1
          fi

          echo "DRIVER_VERSION bumped: ${OLD_VERSION} -> ${NEW_VERSION}"

  # ============================================================
  # Linux: build kernel modules
  # ============================================================
  build-linux:
    name: Build Linux Kernel Modules (${{ matrix.os }})
    needs: detect-changes
    if: needs.detect-changes.outputs.run_linux == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Install kernel headers and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            linux-headers-$(uname -r) \
            linux-modules-$(uname -r) \
            kmod

      - name: Build kernel modules
        working-directory: src/linux
        run: |
          make KBUILD_MODPOST_WARN=1 W=1

      - name: Verify build outputs
        working-directory: src/linux
        run: |
          echo "=== Built kernel modules ==="
          find . -name "*.ko" | sort
          test -f InfParser/qtiDevInf.ko     || (echo "ERROR: qtiDevInf.ko not found"     && exit 1)
          test -f qcom_usb/qcom_usb.ko       || (echo "ERROR: qcom_usb.ko not found"       && exit 1)
          test -f qcom_usbnet/qcom_usbnet.ko || (echo "ERROR: qcom_usbnet.ko not found"    && exit 1)

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: linux-kernel-modules-${{ matrix.os }}
          path: src/linux/**/*.ko
          retention-days: 1

  # ============================================================
  # Linux: build .deb package
  # ============================================================
  build-deb:
    name: Build Linux .deb Package
    runs-on: ubuntu-22.04
    needs: [detect-changes, build-linux]
    if: needs.detect-changes.outputs.run_linux == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Install dpkg tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg dpkg-dev zip

      - name: Build .deb and .zip package
        working-directory: src/linux
        run: bash build-deb.sh zip

      - name: Verify package contents
        working-directory: src/linux
        run: |
          DEB=$(find build -name "*.deb" | head -n 1)
          ZIP=$(find build -name "*.zip" | head -n 1)
          echo "Package: $DEB"
          echo "Zip bundle: $ZIP"
          test -n "$DEB" || (echo "ERROR: No .deb file produced" && exit 1)
          test -n "$ZIP" || (echo "ERROR: No .zip file produced" && exit 1)

          VERSION="$(grep -E '^[[:space:]]*#define[[:space:]]+DRIVER_VERSION' version.h \
            | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "Expected version: $VERSION"

          dpkg-deb -I "$DEB"
          dpkg-deb -I "$DEB" | grep -qE "^ Version: ${VERSION}\$" || \
            (echo "ERROR: .deb Version does not match version.h ($VERSION)" && exit 1)
          dpkg-deb -I "$DEB" | grep -qE "^ Architecture: all\$" || \
            (echo "ERROR: .deb Architecture is not 'all'" && exit 1)
          dpkg-deb -c "$DEB"

          unzip -l "$ZIP"

      - name: Upload .deb/.zip artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: linux-deb-package
          path: |
            src/linux/build/*.deb
            src/linux/build/*.zip
          retention-days: ${{ github.event_name == 'push' && 30 || 1 }}

  # ============================================================
  # Windows: build drivers
  # ============================================================
  build-windows-drivers:
    name: Build Windows Drivers
    needs: detect-changes
    if: needs.detect-changes.outputs.run_windows == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce  # v2

      - name: Install WDK
        shell: pwsh
        run: |
          $wdkUrl       = "https://go.microsoft.com/fwlink/?linkid=2335869"
          $wdkInstaller = "$env:TEMP\wdksetup.exe"
          Write-Host "Downloading WDK via curl (follows redirects)..."
          & curl.exe -L --retry 3 --retry-delay 5 -o $wdkInstaller $wdkUrl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fileSize = (Get-Item $wdkInstaller).Length
          Write-Host "Downloaded installer size: $fileSize bytes"
          if ($fileSize -lt 1MB) {
            Write-Host "ERROR: Downloaded file is too small ($fileSize bytes)" -ForegroundColor Red
            exit 1
          }
          Write-Host "Installing WDK silently..."
          $proc = Start-Process -FilePath $wdkInstaller -ArgumentList "/quiet /norestart" -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            Write-Host "ERROR: WDK installer exited with code $($proc.ExitCode)" -ForegroundColor Red
            exit $proc.ExitCode
          }
          Write-Host "WDK installation complete."

      - name: Build Windows drivers (x86, x64, arm64)
        shell: pwsh
        working-directory: build
        run: |
          powershell -ExecutionPolicy Bypass -File "build_drivers.ps1" -OutputTo "$env:GITHUB_WORKSPACE\build\target"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify driver build outputs
        shell: pwsh
        run: |
          $driversDir = "build\target\drivers"
          Write-Host "=== Driver build outputs ==="
          Get-ChildItem -Path $driversDir -Recurse -File | Select-Object FullName | Format-Table -AutoSize
          $sysFiles = Get-ChildItem -Path $driversDir -Recurse -Filter "*.sys"
          if ($sysFiles.Count -eq 0) {
            Write-Host "ERROR: No .sys files found in $driversDir" -ForegroundColor Red
            exit 1
          }
          Write-Host "Found $($sysFiles.Count) .sys file(s)." -ForegroundColor Green

      - name: Upload Windows driver artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: windows-drivers
          path: build/target/drivers/
          # Kept longer on PRs into main: that's the release-candidate
          # artifact windows-signing.yml signs, attests, and builds the
          # installer from. See docs/windows/RELEASING.md.
          retention-days: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') && 7 || 1 }}

  # Installer building moved to windows-signing.yml: the installer must be
  # built from the *attested* drivers and EV-signed itself, which only
  # happens on the internal runner after Microsoft attestation. See
  # docs/windows/RELEASING.md.
