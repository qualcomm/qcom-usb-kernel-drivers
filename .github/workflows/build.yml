name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # ============================================================
  # Linux: build kernel modules
  # ============================================================
  build-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install kernel headers and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            linux-headers-$(uname -r) \
            linux-modules-$(uname -r) \
            linux-modules-extra-$(uname -r) \
            kmod \
            binutils \
            python3

      - name: Locate dependency Module.symvers files
        run: |
          # usbnet and usbserial may be loadable modules OR built into the kernel.
          # Strategy (in priority order):
          #   1. Use the kernel build-tree Module.symvers if it already covers all
          #      required symbols — modpost picks it up automatically, no extra flags.
          #   2. Extract exported symbols + real CRCs from .ko ELF files.
          #      linux-modules-extra-$(uname -r) is installed above so the .ko files
          #      are always present on the runner even when the symbols are also
          #      built into the kernel image.
          #   3. Synthesize 0x00000000 CRC stubs from /proc/kallsyms as a last resort
          #      (modpost warns but does not fail — acceptable for CI).
          set -euo pipefail
          KREL=$(uname -r)
          SYMVERS_OUT=/tmp/deps.symvers
          > "$SYMVERS_OUT"

          NEEDED_SYMS="usbnet_probe usbnet_disconnect usbnet_suspend usbnet_resume \
                       usbnet_start_xmit usbnet_change_mtu usbnet_skb_return \
                       usbnet_link_change usb_serial_generic_open usb_serial_suspend \
                       usb_serial_resume"

          # ── Step 1: kernel build-tree Module.symvers ──────────────────────────
          SYS_SYMVERS=/lib/modules/$KREL/build/Module.symvers
          if [ -f "$SYS_SYMVERS" ]; then
            MISSING=false
            for SYM in $NEEDED_SYMS; do
              grep -qP "\t${SYM}\t" "$SYS_SYMVERS" 2>/dev/null || { MISSING=true; break; }
            done
            if [ "$MISSING" = "false" ]; then
              echo "All required symbols present in build-tree Module.symvers — no KBUILD_EXTRA_SYMBOLS needed."
              echo "EXTRA_SYMVERS=" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Some symbols missing from build-tree Module.symvers — building supplemental symvers."
          fi

          # ── Step 2: extract from .ko ELF files ───────────────────────────────
          decompress_ko() {
            local src="$1" dst
            dst="/tmp/$(basename "${src%.zst}" .xz)"
            case "$src" in
              *.zst) zstd -d --force -o "$dst" "$src" ;;
              *.xz)  xz -dk --stdout "$src" > "$dst" ;;
              *)     cp -f "$src" "$dst" ;;
            esac
            echo "$dst"
          }

          ko_exported_symvers() {
            local ko="$1" modname
            modname=$(basename "$ko" .ko)
            python3 - "$ko" "$modname" <<'PYEOF'
          import subprocess, struct, sys, re
          ko_path, modname = sys.argv[1], sys.argv[2]

          readelf_S = subprocess.run(['readelf', '-S', '--wide', ko_path],
                                     capture_output=True, text=True).stdout
          sec_names = {}
          for line in readelf_S.splitlines():
              m = re.match(r'\s*\[\s*(\d+)\]\s+(\S+)', line)
              if m:
                  sec_names[int(m.group(1))] = m.group(2)

          readelf_s = subprocess.run(['readelf', '-s', '--wide', ko_path],
                                     capture_output=True, text=True).stdout
          exported, crc_entries = {}, {}
          for line in readelf_s.splitlines():
              m = re.match(r'\s*\d+:\s+([0-9a-fA-F]+)\s+\d+\s+\S+\s+\S+\s+\S+\s+(\d+)\s+(\S+)', line)
              if not m:
                  continue
              offset, sec_idx, sym = int(m.group(1), 16), int(m.group(2)), m.group(3)
              sec = sec_names.get(sec_idx, '')
              if sym.startswith('__ksymtab_'):
                  real = sym[len('__ksymtab_'):]
                  if sec == '__ksymtab_gpl':
                      exported[real] = 'EXPORT_SYMBOL_GPL'
                  elif sec == '__ksymtab':
                      exported.setdefault(real, 'EXPORT_SYMBOL')
              elif sym.startswith('__crc_') and sec in ('__kcrctab_gpl', '__kcrctab'):
                  crc_entries[sym[len('__crc_'):]] = (sec, offset)

          if not exported:
              sys.exit(0)

          def section_bytes(sec_name):
              out = subprocess.run(['objdump', '-s', '-j', sec_name, ko_path],
                                   capture_output=True, text=True).stdout
              data = bytearray()
              for line in out.splitlines():
                  parts = line.strip().split()
                  if not parts:
                      continue
                  try:
                      int(parts[0], 16)
                  except ValueError:
                      continue
                  for h in parts[1:]:
                      if re.fullmatch(r'[0-9a-fA-F]{8}', h):
                          data.extend(bytes.fromhex(h))
                      else:
                          break
              return data

          sec_data, crcs = {}, {}
          for sym, (sec, off) in crc_entries.items():
              if sym not in exported:
                  continue
              if sec not in sec_data:
                  sec_data[sec] = section_bytes(sec)
              if off + 4 <= len(sec_data[sec]):
                  crcs[sym] = struct.unpack_from('<I', sec_data[sec], off)[0]

          for sym, etype in sorted(exported.items()):
              print(f'0x{crcs.get(sym, 0):08x}\t{sym}\t{modname}\t{etype}')
          PYEOF
          }

          for MODNAME in usbnet usbserial; do
            KO_PATH=$(find /lib/modules/$KREL -name "${MODNAME}.ko*" 2>/dev/null | head -n1)
            if [ -n "$KO_PATH" ]; then
              echo "Extracting symvers from: $KO_PATH"
              PLAIN_KO=$(decompress_ko "$KO_PATH")
              while IFS= read -r line; do
                SYM=$(awk '{print $2}' <<< "$line")
                grep -qP "\t${SYM}\t" "$SYMVERS_OUT" 2>/dev/null || echo "$line" >> "$SYMVERS_OUT"
              done < <(ko_exported_symvers "$PLAIN_KO" 2>/dev/null || true)
            else
              echo "WARNING: ${MODNAME}.ko not found under /lib/modules/$KREL"
            fi
          done

          # ── Step 3: /proc/kallsyms stub fallback ─────────────────────────────
          if [ -r /proc/kallsyms ]; then
            for SYM in $NEEDED_SYMS; do
              grep -qP "\t${SYM}\t" "$SYMVERS_OUT" 2>/dev/null && continue
              if grep -qE "__ksymtab_${SYM}([[:space:]]|$)" /proc/kallsyms 2>/dev/null; then
                echo "Stub from kallsyms: $SYM"
                printf '0x00000000\t%s\tvmlinux\tEXPORT_SYMBOL\n' "$SYM" >> "$SYMVERS_OUT"
              fi
            done
          fi

          LINES=$(wc -l < "$SYMVERS_OUT")
          echo "--- $SYMVERS_OUT ($LINES entries) ---"
          cat "$SYMVERS_OUT" || true
          [ "$LINES" -gt 0 ] || echo "WARNING: symvers file is empty — build may fail."

          echo "EXTRA_SYMVERS=$SYMVERS_OUT" >> "$GITHUB_ENV"

      - name: Build kernel modules
        working-directory: src/linux
        run: |
          if [ -s "${EXTRA_SYMVERS:-}" ]; then
            make KBUILD_EXTRA_SYMBOLS="$EXTRA_SYMVERS"
          else
            make
          fi

      - name: Verify build outputs
        working-directory: src/linux
        run: |
          echo "=== Built kernel modules ==="
          find . -name "*.ko" | sort
          test -f InfParser/qtiDevInf.ko  || (echo "ERROR: qtiDevInf.ko not found"  && exit 1)
          test -f qcom_usb/qcom_usb.ko    || (echo "ERROR: qcom_usb.ko not found"    && exit 1)
          test -f qcom_usbnet/qcom_usbnet.ko || (echo "ERROR: qcom_usbnet.ko not found" && exit 1)

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-kernel-modules-${{ matrix.os }}
          path: |
            src/linux/**/*.ko
          retention-days: 7

  # ============================================================
  # Linux: build .deb package (ubuntu-22.04 only)
  # ============================================================
  build-deb:
    runs-on: ubuntu-22.04
    needs: build-linux

    steps:
      - uses: actions/checkout@v4

      - name: Install dpkg tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg

      - name: Build .deb package
        working-directory: src/linux
        run: bash build-deb.sh

      - name: Verify .deb package
        working-directory: src/linux
        run: |
          DEB=$(find build -name "*.deb" | head -n 1)
          echo "Package: $DEB"
          test -n "$DEB" || (echo "ERROR: No .deb file produced" && exit 1)
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-package
          path: src/linux/build/*.deb
          retention-days: 7

  # ============================================================
  # Windows: build drivers (x86, x64, arm64)
  # ============================================================
  build-windows-drivers:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install WDK
        shell: pwsh
        run: |
          # Pinned to WDK 10.0.26100.6584 (Windows 11 25H2), the latest WDK
          # supported with Visual Studio 2022, which is what the windows-2022
          # runner provides. Using a direct linkid instead of the latest-WDK
          # redirect prevents silent breakage when Microsoft ships a new WDK.
          # To upgrade: verify the new WDK + VS2022 combination builds cleanly,
          # then update this linkid and the comment above.
          $wdkUrl = "https://go.microsoft.com/fwlink/?linkid=2335869"
          $wdkInstaller = "$env:TEMP\wdksetup.exe"

          Write-Host "Downloading WDK via curl (follows redirects)..."
          & curl.exe -L --retry 3 --retry-delay 5 -o $wdkInstaller $wdkUrl
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: curl download failed with exit code $LASTEXITCODE" -ForegroundColor Red
            exit $LASTEXITCODE
          }

          $fileSize = (Get-Item $wdkInstaller).Length
          Write-Host "Downloaded installer size: $fileSize bytes"
          if ($fileSize -lt 1MB) {
            Write-Host "ERROR: Downloaded file is too small ($fileSize bytes) -- likely corrupted or a redirect page." -ForegroundColor Red
            exit 1
          }

          Write-Host "Installing WDK silently..."
          $proc = Start-Process -FilePath $wdkInstaller `
                                -ArgumentList "/quiet /norestart" `
                                -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            Write-Host "ERROR: WDK installer exited with code $($proc.ExitCode)" -ForegroundColor Red
            exit $proc.ExitCode
          }
          Write-Host "WDK installation complete."

      - name: Build Windows drivers (x86, x64, arm64)
        shell: pwsh
        working-directory: build
        run: |
          powershell -ExecutionPolicy Bypass -File "build_drivers.ps1" -OutputTo "$env:GITHUB_WORKSPACE\build\target"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify driver build outputs
        shell: pwsh
        run: |
          $driversDir = "build\target\drivers"
          Write-Host "=== Driver build outputs ==="
          Get-ChildItem -Path $driversDir -Recurse -File | Select-Object FullName | Format-Table -AutoSize
          $sysFiles = Get-ChildItem -Path $driversDir -Recurse -Filter "*.sys"
          if ($sysFiles.Count -eq 0) {
            Write-Host "ERROR: No .sys files found in $driversDir" -ForegroundColor Red
            exit 1
          }
          Write-Host "Found $($sysFiles.Count) .sys file(s)." -ForegroundColor Green

      - name: Upload Windows driver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-drivers
          path: build/target/drivers/
          retention-days: 7

  # ============================================================
  # Windows: build installers (x86, x64, arm64)
  # ============================================================
  build-windows-installer:
    runs-on: windows-2022
    needs: build-windows-drivers

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Download Windows driver artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-drivers
          path: build/target/drivers

      - name: Build Windows installers (x86, x64, arm64) — skip signing
        shell: cmd
        working-directory: build
        run: |
          call build_installer.bat --no_sign_required
          if errorlevel 1 exit /b 1

      - name: Verify installer outputs
        shell: pwsh
        run: |
          $targetDir = "build\target"
          Write-Host "=== Installer build outputs ==="
          Get-ChildItem -Path $targetDir -Filter "*.exe" | Select-Object FullName | Format-Table -AutoSize
          $exeFiles = Get-ChildItem -Path $targetDir -Filter "qcom_usb_kernel_drivers_*.exe"
          if ($exeFiles.Count -eq 0) {
            Write-Host "ERROR: No installer .exe files found in $targetDir" -ForegroundColor Red
            exit 1
          }
          Write-Host "Found $($exeFiles.Count) installer(s)." -ForegroundColor Green

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: build/target/qcom_usb_kernel_drivers_*.exe
          retention-days: 7
