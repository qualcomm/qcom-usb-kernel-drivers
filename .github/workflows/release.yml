name: Release

on:
  workflow_dispatch:
    inputs:
      linux_version:
        description: >
          Linux driver version to prepare for release (e.g. 1.0.6.8).
          Leave empty to skip. Must be newer than the latest
          release-lnx-v* tag. Pushes ci/release-lnx-<version> for you to
          open as a PR into develop - see docs/linux/RELEASING.md.
        required: false
        type: string
        default: ''
      promote_linux:
        description: >
          Linux version whose existing GitHub pre-release should be
          promoted to final + Latest (e.g. 1.0.6.8). Leave empty to skip.
          Gated by the 'release' environment's required reviewers.
        required: false
        type: string
        default: ''
      windows_version:
        description: >
          Windows driver version to release (e.g. 1.00.94.6).
          Leave empty to skip the Windows release.
        required: false
        type: string
        default: ''
      filter_version:
        description: >
          Filter driver sub-version (e.g. 1.0.1.6).
          Leave empty to keep the current value in qcversion.h.
        required: false
        type: string
        default: ''
      net_version:
        description: >
          NDIS/net driver sub-version (e.g. 5.0.1.2).
          Leave empty to keep the current value in qcversion.h.
        required: false
        type: string
        default: ''
      wdfserial_version:
        description: >
          WDF serial driver sub-version (e.g. 1.0.3.7).
          Leave empty to keep the current value in qcversion.h.
        required: false
        type: string
        default: ''
      qdss_version:
        description: >
          QDSS driver sub-version (e.g. 1.0.4.2).
          Leave empty to keep the current value in qcversion.h.
        required: false
        type: string
        default: ''
      adb_version:
        description: >
          ADB driver sub-version (e.g. 1.0.1.7).
          Leave empty to keep the current value in qcversion.h.
        required: false
        type: string
        default: ''
      base_branch:
        description: 'Base branch to cut the Windows release from'
        required: false
        type: string
        default: 'main'
      release_notes:
        description: 'Windows release notes (Markdown). Defaults to auto-generated notes.'
        required: false
        type: string
        default: ''
  workflow_run:
    workflows: ["Build"]
    types: [completed]

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Validate dispatch inputs before doing any real work
  # ───────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate inputs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      do_prepare: ${{ steps.check.outputs.do_prepare }}
      do_promote: ${{ steps.check.outputs.do_promote }}
      do_windows: ${{ steps.check.outputs.do_windows }}
    steps:
      - name: Check actor is a maintainer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          PERMISSION=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" \
            --jq '.permission' 2>/dev/null || echo "none")
          echo "Actor '${ACTOR}' permission: ${PERMISSION}"
          case "$PERMISSION" in
            admin|maintain|write)
              echo "Authorized - proceeding."
              ;;
            *)
              echo "ERROR: Only maintainers (write/maintain/admin) may trigger this workflow."
              echo "Actor '${ACTOR}' has permission '${PERMISSION}'."
              exit 1
              ;;
          esac

      - name: Validate inputs and set flags
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          LNX: ${{ inputs.linux_version }}
          PROMOTE: ${{ inputs.promote_linux }}
          WIN: ${{ inputs.windows_version }}
        run: |
          if [ -z "$LNX" ] && [ -z "$PROMOTE" ] && [ -z "$WIN" ]; then
            echo "ERROR: At least one of linux_version, promote_linux, or windows_version must be provided."
            exit 1
          fi

          VERSION_RE='^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'

          # ── linux_version (prepare) ─────────────────────────────────────
          if [ -n "$LNX" ]; then
            if ! echo "$LNX" | grep -qE "$VERSION_RE"; then
              echo "ERROR: linux_version '$LNX' does not match expected format X.X.X.X"
              exit 1
            fi

            BRANCH="ci/release-lnx-${LNX}"
            TAG="release-lnx-v${LNX}"

            BRANCH_EXISTS=$(gh api "repos/${REPO}/git/matching-refs/heads/${BRANCH}" \
              --jq ".[] | select(.ref == \"refs/heads/${BRANCH}\") | .ref")
            if [ -n "$BRANCH_EXISTS" ]; then
              echo "ERROR: branch '${BRANCH}' already exists."
              exit 1
            fi

            TAG_EXISTS=$(gh api "repos/${REPO}/git/matching-refs/tags/${TAG}" \
              --jq ".[] | select(.ref == \"refs/tags/${TAG}\") | .ref")
            if [ -n "$TAG_EXISTS" ]; then
              echo "ERROR: tag '${TAG}' already exists."
              exit 1
            fi

            LATEST=$(gh api "repos/${REPO}/git/matching-refs/tags/release-lnx-v" \
              --jq '.[].ref' | sed 's#refs/tags/release-lnx-v##' | sort -V | tail -1)
            if [ -n "$LATEST" ]; then
              TOP=$(printf '%s\n%s\n' "$LATEST" "$LNX" | sort -V | tail -1)
              if [ "$TOP" != "$LNX" ] || [ "$LNX" = "$LATEST" ]; then
                echo "ERROR: linux_version '$LNX' must be newer than the latest tag release-lnx-v${LATEST}."
                exit 1
              fi
            fi

            echo "do_prepare=true" >> "$GITHUB_OUTPUT"
          else
            echo "do_prepare=false" >> "$GITHUB_OUTPUT"
          fi

          # ── promote_linux (promote) ─────────────────────────────────────
          if [ -n "$PROMOTE" ]; then
            if ! echo "$PROMOTE" | grep -qE "$VERSION_RE"; then
              echo "ERROR: promote_linux '$PROMOTE' does not match expected format X.X.X.X"
              exit 1
            fi
            echo "do_promote=true" >> "$GITHUB_OUTPUT"
          else
            echo "do_promote=false" >> "$GITHUB_OUTPUT"
          fi

          # ── windows_version ───────────────────────────────────────────
          if [ -n "$WIN" ]; then
            if ! echo "$WIN" | grep -qE "$VERSION_RE"; then
              echo "ERROR: windows_version '$WIN' does not match expected format X.XX.XX.X"
              exit 1
            fi
            echo "do_windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "do_windows=false" >> "$GITHUB_OUTPUT"
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # Stage: prepare a Linux release branch on top of develop, for a maintainer
  # to open as a PR. Never opens the PR itself (a GITHUB_TOKEN-opened PR
  # would not trigger required checks). See docs/linux/RELEASING.md.
  # ───────────────────────────────────────────────────────────────────────────
  linux-prepare:
    name: Prepare Linux release ${{ inputs.linux_version }}
    needs: validate
    if: needs.validate.outputs.do_prepare == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity as triggering actor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          ACTOR_ID=$(gh api "users/${ACTOR}" --jq '.id')
          git config user.name  "${ACTOR}"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"

      - name: Create release branch
        id: branch
        env:
          VERSION: ${{ inputs.linux_version }}
        run: |
          BRANCH="ci/release-lnx-${VERSION}"

          if git ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "ERROR: Branch '${BRANCH}' already exists on remote."
            exit 1
          fi

          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Update src/linux/version.h
        env:
          VERSION: ${{ inputs.linux_version }}
        run: |
          FILE="src/linux/version.h"
          sed -i "s/#define DRIVER_VERSION \".*\"/#define DRIVER_VERSION \"${VERSION}\"/" "$FILE"
          grep -q "\"${VERSION}\"" "$FILE" || \
            { echo "ERROR: version.h was not updated correctly"; exit 1; }
          echo "Updated $FILE:"
          cat "$FILE"

      - name: Ensure RELEASES.md has a section for this version
        id: notes
        env:
          VERSION: ${{ inputs.linux_version }}
        run: |
          FILE="src/linux/RELEASES.md"

          if grep -qF "## [${VERSION}]" "$FILE"; then
            echo "RELEASES.md already has a section for ${VERSION} - leaving it untouched."
            echo "inserted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREV_TAG=$(git tag -l 'release-lnx-v*' | sed 's/^release-lnx-v//' | sort -V | tail -1)
          if [ -n "$PREV_TAG" ]; then
            LOG_RANGE="release-lnx-v${PREV_TAG}..HEAD"
          else
            LOG_RANGE="HEAD"
          fi

          python3 - "$FILE" "$VERSION" "$LOG_RANGE" <<'PYEOF'
          import subprocess
          import sys
          from datetime import date

          file_path, version, log_range = sys.argv[1], sys.argv[2], sys.argv[3]

          with open(file_path, "rb") as f:
              raw = f.read()

          crlf = b"\r\n" in raw
          nl = "\r\n" if crlf else "\n"
          text = raw.decode("utf-8")
          lines = text.split("\r\n" if crlf else "\n")

          log_args = ["git", "log", "--pretty=format:%s", log_range,
                      "--", "src/linux", "scripts/linux"]
          subjects = subprocess.run(log_args, capture_output=True, text=True, check=True) \
              .stdout.splitlines()
          subjects = [s for s in subjects if s.strip()]
          if not subjects:
              subjects = ["Version bump to " + version]

          today = date.today().isoformat()
          section = [f"## [{version}] - {today}"]
          section += [f"{i + 1}. {s}" for i, s in enumerate(subjects)]
          section.append("")

          insert_at = None
          for i, line in enumerate(lines):
              if line.strip() == "---":
                  insert_at = i + 1
                  break
          if insert_at is None:
              insert_at = len(lines)

          new_lines = lines[:insert_at] + section + lines[insert_at:]
          with open(file_path, "wb") as f:
              f.write(nl.join(new_lines).encode("utf-8"))
          PYEOF

          echo "Inserted draft RELEASES.md section for ${VERSION}:"
          grep -A 5 -F "## [${VERSION}]" "$FILE"
          echo "inserted=true" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        env:
          VERSION: ${{ inputs.linux_version }}
        run: |
          git add src/linux/version.h src/linux/RELEASES.md
          git commit -s -m "ci/release-lnx-${VERSION}: prepare Linux release ${VERSION}"

      - name: Push release branch
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          git push origin "$BRANCH"

      - name: Print PR link in job summary
        env:
          VERSION: ${{ inputs.linux_version }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          REPO: ${{ github.repository }}
          INSERTED: ${{ steps.notes.outputs.inserted }}
        run: |
          TITLE="${BRANCH}: prepare Linux release ${VERSION}"
          BODY="## Linux release ${VERSION}

          Bumps \`src/linux/version.h\` to ${VERSION}."
          if [ "$INSERTED" = "true" ]; then
            BODY="${BODY}

          A draft \`RELEASES.md\` section was generated from the commits since the
          previous tag - please review and finalize the notes before merging,
          since they ship inside the \`.deb\`."
          fi
          BODY="${BODY}

          ### QA
          - [ ] Download the \`linux-deb-package\` artifact from this PR's Build run.
          - [ ] Install the \`.deb\` on each supported distribution/kernel combination.
          - [ ] Merge into \`develop\` once QA passes."

          ENC_TITLE=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TITLE")
          ENC_BODY=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$BODY")
          COMPARE_URL="https://github.com/${REPO}/compare/develop...${BRANCH}?quick_pull=1&title=${ENC_TITLE}&body=${ENC_BODY}"

          {
            echo "## Linux Release Prepared - v${VERSION}"
            echo ""
            echo "Branch \`${BRANCH}\` has been pushed."
            echo ""
            echo "**[Open the release PR into develop](${COMPARE_URL})**"
            echo ""
            echo "> Open it from this link (not a fresh PR) so the PR is attributed to"
            echo "> you - a bot-opened PR would not trigger required checks."
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # Stage: automatically tag + pre-release when Build succeeds on main.
  # Never rebuilds - downloads the exact artifact Build produced.
  # ───────────────────────────────────────────────────────────────────────────
  linux-prerelease:
    name: Linux pre-release
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      # Safe against "pwn request": the job `if:` above restricts this to
      # workflow_run.event == 'push' on head_branch == 'main', so head_sha
      # is always a commit already on main (merged/reviewed or a trusted
      # maintainer push) - never an untrusted fork PR's head commit. See
      # https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
      - name: Checkout built commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Determine version and tag state
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION=$(grep -E '^[[:space:]]*#define[[:space:]]+DRIVER_VERSION' src/linux/version.h \
            | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="release-lnx-v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          TAG_SHA=$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" \
            | awk '{print $1}' | tail -1)

          if [ -z "$TAG_SHA" ]; then
            echo "case=new" >> "$GITHUB_OUTPUT"
          elif [ "$TAG_SHA" = "$SHA" ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "case=done" >> "$GITHUB_OUTPUT"
            else
              echo "case=recover" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "case=no-bump" >> "$GITHUB_OUTPUT"
          fi

          echo "Version: $VERSION  Tag: $TAG  Case: (see output)"

      - name: No-op (no version bump / already released)
        if: steps.state.outputs.case == 'done' || steps.state.outputs.case == 'no-bump'
        env:
          CASE: ${{ steps.state.outputs.case }}
          TAG: ${{ steps.state.outputs.tag }}
        run: |
          {
            echo "## Linux Pre-release - no action"
            if [ "$CASE" = "done" ]; then
              echo "\`${TAG}\` is already tagged and released - nothing to do."
            else
              echo "No Linux version bump on this push - nothing to do."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate version and release notes
        if: steps.state.outputs.case == 'new'
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.state.outputs.version }}
        run: |
          LATEST=$(gh api "repos/${REPO}/git/matching-refs/tags/release-lnx-v" \
            --jq '.[].ref' | sed 's#refs/tags/release-lnx-v##' | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            TOP=$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -1)
            if [ "$TOP" != "$VERSION" ] || [ "$VERSION" = "$LATEST" ]; then
              echo "ERROR: DRIVER_VERSION '$VERSION' is not newer than the latest tag release-lnx-v${LATEST}."
              exit 1
            fi
          fi

          SECTION=$(awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") {found=1; next}
            found && /^## \[/ {exit}
            found && /^---/ {exit}
            found {print}
          ' src/linux/RELEASES.md)

          if [ -z "$(echo "$SECTION" | tr -d '[:space:]')" ]; then
            echo "ERROR: RELEASES.md has no (or an empty) section for ${VERSION}."
            exit 1
          fi

          {
            echo "$SECTION"
          } > /tmp/release_notes_body.md
          echo "Release notes section:"
          cat /tmp/release_notes_body.md

      - name: Create and push tag
        if: steps.state.outputs.case == 'new'
        env:
          TAG: ${{ steps.state.outputs.tag }}
          VERSION: ${{ steps.state.outputs.version }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Linux release v${VERSION}"
          git push "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "$TAG"

      - name: Download build artifact
        if: steps.state.outputs.case == 'new' || steps.state.outputs.case == 'recover'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p /tmp/assets
          gh run download "$RUN_ID" --name linux-deb-package --dir /tmp/assets
          ls -lh /tmp/assets

      - name: Verify artifact and write checksums
        if: steps.state.outputs.case == 'new' || steps.state.outputs.case == 'recover'
        env:
          VERSION: ${{ steps.state.outputs.version }}
        run: |
          cd /tmp/assets
          DEB=$(find . -name "*.deb" | head -n 1)
          test -n "$DEB" || { echo "ERROR: no .deb in artifact"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends dpkg-dev
          dpkg-deb -I "$DEB" | grep -qE "^ Version: ${VERSION}\$" || \
            { echo "ERROR: artifact .deb version does not match ${VERSION}"; exit 1; }
          sha256sum *.deb *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Build release notes (recover case)
        if: steps.state.outputs.case == 'recover'
        env:
          VERSION: ${{ steps.state.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") {found=1; next}
            found && /^## \[/ {exit}
            found && /^---/ {exit}
            found {print}
          ' src/linux/RELEASES.md > /tmp/release_notes_body.md

      - name: Create pre-release
        if: steps.state.outputs.case == 'new' || steps.state.outputs.case == 'recover'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.state.outputs.tag }}
          VERSION: ${{ steps.state.outputs.version }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          {
            cat /tmp/release_notes_body.md
            echo ""
            echo "### Installation"
            echo '```bash'
            echo "sudo dpkg -i qud_${VERSION}_all.deb"
            echo '```'
            echo ""
            echo "### Uninstall"
            echo '```bash'
            echo "sudo dpkg -r qud"
            echo '```'
            echo ""
            echo "### SHA-256"
            echo '```'
            cat /tmp/assets/SHA256SUMS
            echo '```'
            echo ""
            echo "Built from run: https://github.com/${REPO}/actions/runs/${RUN_ID}"
          } > /tmp/release_notes.md

          gh release create "$TAG" \
            /tmp/assets/*.deb /tmp/assets/*.zip /tmp/assets/SHA256SUMS \
            --title "$TAG" \
            --notes-file /tmp/release_notes.md \
            --prerelease

          echo "## Linux Pre-release created - ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "QA: install the pre-release assets, then promote via the Release workflow's \`promote_linux\` input once verified." >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # Stage: promote an existing Linux pre-release to final + Latest.
  # Gated by the 'release' environment's required reviewers. Nothing is
  # rebuilt or re-tagged here.
  # ───────────────────────────────────────────────────────────────────────────
  linux-promote:
    name: Promote Linux release ${{ inputs.promote_linux }}
    needs: validate
    if: needs.validate.outputs.do_promote == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Verify release exists and is a pre-release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.promote_linux }}
        run: |
          TAG="release-lnx-v${VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if ! gh release view "$TAG" --json isPrerelease >/tmp/release.json 2>/dev/null; then
            echo "ERROR: release '${TAG}' does not exist."
            exit 1
          fi

          IS_PRERELEASE=$(jq -r '.isPrerelease' /tmp/release.json)
          if [ "$IS_PRERELEASE" != "true" ]; then
            echo "Release '${TAG}' is already final - nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify asset checksums
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          mkdir -p /tmp/promote
          gh release download "$TAG" -D /tmp/promote
          cd /tmp/promote
          sha256sum -c SHA256SUMS

      - name: Mark release final and Latest
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          gh release edit "$TAG" --prerelease=false --latest
          echo "Promoted ${TAG} to final + Latest."
          echo "## Linux release promoted - ${TAG}" >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # Windows release
  #
  # NOTE: Building signed Windows kernel drivers requires Visual Studio +
  # Windows Driver Kit (WDK) and a code-signing certificate — tooling that is
  # not available on standard GitHub-hosted runners.
  #
  # This job therefore:
  #   1. Creates the release branch and bumps the version.
  #   2. Creates the annotated tag.
  #   3. Opens a DRAFT GitHub release so that the signed build artifacts
  #      (produced by your internal Windows build pipeline) can be attached
  #      before the release is published.
  #
  # To build locally:  .\build\build_drivers.ps1  (requires VS + WDK)
  # Out of scope for the Linux release redesign - unchanged. See decision #11
  # in docs/linux/RELEASING.md.
  # ───────────────────────────────────────────────────────────────────────────
  release-windows:
    name: Windows release ${{ inputs.windows_version }}
    needs: validate
    if: needs.validate.outputs.do_windows == 'true'
    runs-on: ubuntu-latest   # branch/tag/release work; no WDK needed here
    environment: release
    permissions:
      contents: write

    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

      # ── 1. Create release branch ──────────────────────────────────────────
      - name: Create release branch
        id: branch
        env:
          VERSION: ${{ inputs.windows_version }}
        run: |
          BRANCH="release-win-${VERSION}"

          if git ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "ERROR: Branch '${BRANCH}' already exists on remote."
            exit 1
          fi

          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # ── 2. Bump version in qcversion.h ────────────────────────────────────
      - name: Update src/windows/qcversion.h
        env:
          VERSION: ${{ inputs.windows_version }}
          FILTER_VER: ${{ inputs.filter_version }}
          NET_VER: ${{ inputs.net_version }}
          WDFSERIAL_VER: ${{ inputs.wdfserial_version }}
          QDSS_VER: ${{ inputs.qdss_version }}
          ADB_VER: ${{ inputs.adb_version }}
        run: |
          FILE="src/windows/qcversion.h"

          # Helper: update a VERSION + optional FILE_VERSION pair
          update_driver_ver() {
            local ver_macro="$1"
            local file_macro="$2"   # pass "" to skip FILE_VERSION
            local ver="$3"
            [ -z "$ver" ] && return 0   # skip if not provided
            local ver_comma="${ver//./ }"; ver_comma="${ver_comma// /,}"
            sed -i "s/\(#define ${ver_macro}[[:space:]]\+\)[^[:space:]]*/\1${ver}/" "$FILE"
            [ -n "$file_macro" ] && \
              sed -i "s/\(#define ${file_macro}[[:space:]]\+\)[^[:space:]]*/\1${ver_comma}/" "$FILE"
            echo "  ${ver_macro} -> ${ver}"
          }

          echo "Updating $FILE:"

          # Package-level version (always updated)
          VERSION_COMMA="${VERSION//./ }"; VERSION_COMMA="${VERSION_COMMA// /,}"
          sed -i "s/\(#define QCOM_USB_DRIVERS_PRODUCT_VERSION[[:space:]]\+\)[^ ]*/\1${VERSION}/" "$FILE"
          sed -i "s/\(#define QCOM_USB_DRIVERS_FILE_VERSION[[:space:]]\+\)[^[:space:]]*/\1${VERSION_COMMA}/" "$FILE"
          echo "  QCOM_USB_DRIVERS_PRODUCT_VERSION -> ${VERSION}"

          # Individual driver sub-versions (updated only when input is non-empty)
          update_driver_ver "QCOM_FILTER_VERSION"    "QCOM_FILTER_FILE_VERSION"    "$FILTER_VER"
          update_driver_ver "QCOM_NET_VERSION"       "QCOM_NET_FILE_VERSION"       "$NET_VER"
          update_driver_ver "QCOM_WDFSERIAL_VERSION" "QCOM_WDFSERIAL_FILE_VERSION" "$WDFSERIAL_VER"
          update_driver_ver "QCOM_QDSS_VERSION"      "QCOM_QDSS_FILE_VERSION"      "$QDSS_VER"
          update_driver_ver "QCOM_ADB_VERSION"       ""                            "$ADB_VER"

          echo ""
          echo "Final version lines in $FILE:"
          grep -E "_VERSION\b" "$FILE"

          # Verify package version was applied
          grep -q "QCOM_USB_DRIVERS_PRODUCT_VERSION ${VERSION}" "$FILE" || \
            { echo "ERROR: PRODUCT_VERSION was not updated correctly"; exit 1; }

      # ── 3. Commit & push release branch ───────────────────────────────────
      - name: Commit version bump
        env:
          VERSION: ${{ inputs.windows_version }}
        run: |
          git add src/windows/qcversion.h
          git commit -m "Update Windows driver version to ${VERSION}"

      - name: Push release branch
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          git push origin "$BRANCH"

      # ── 4. Create tag ─────────────────────────────────────────────────────
      - name: Create and push tag
        id: tag
        env:
          VERSION: ${{ inputs.windows_version }}
        run: |
          TAG="release-win-v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "ERROR: Tag '${TAG}' already exists on remote."
            exit 1
          fi

          git tag -a "$TAG" -m "Windows release v${VERSION}"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # ── 5. Create draft GitHub release ────────────────────────────────────
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.windows_version }}
          TAG: ${{ steps.tag.outputs.tag }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          NOTES="$RELEASE_NOTES"

          if [ -z "$NOTES" ]; then
            NOTES="## Windows driver release v${VERSION}

          Built from branch \`${BRANCH}\`.

          > **Note:** Attach the signed build artifacts produced by the internal
          > Windows build pipeline before publishing this release.
          >
          > Build locally with: \`.\build\build_drivers.ps1\` (requires Visual Studio + WDK)"
          fi

          # Windows releases always start as draft because signed artifacts
          # must be attached by the internal build pipeline before publishing.
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES" \
            --draft

          echo "Windows draft release created: $TAG"
          echo "   Attach signed build artifacts and publish when ready."
