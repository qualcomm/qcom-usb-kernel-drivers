name: Block PRs From Upstream Repository

# Detects and closes pull requests that originate from a branch inside
# the upstream (canonical) repository rather than from a personal fork.
# This enforces the fork-based contribution workflow described in CONTRIBUTING.md.

on:
  pull_request:
    types:
      - opened
      - reopened

permissions:
  contents: read

jobs:
  block-upstream-pr:
    name: Block PR From Upstream Repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Detect and block upstream-origin PRs
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const pr          = context.payload.pull_request;
            const headRepo    = pr.head.repo.full_name;
            const baseRepo    = pr.base.repo.full_name;
            const prNumber    = pr.number;
            const contributor = pr.user.login;

            console.log(`PR #${prNumber} — head: ${headRepo} → base: ${baseRepo}`);

            // If the head and base repos are the same, the PR was opened from
            // a branch inside the upstream repo — block it.
            if (headRepo !== baseRepo) {
              console.log("PR originates from a fork — no action needed.");
              return;
            }

            // Post a detailed comment before closing.
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: prNumber,
              body: [
                `## PRs From the Upstream Repository Are Not Accepted`,
                ``,
                `Hi @${contributor}, thank you for your interest in contributing!`,
                ``,
                `This pull request was opened from a branch inside the upstream repository (\`${baseRepo}\`) rather than from a personal fork. To keep the repository history clean and maintain a clear separation between maintainer and contributor work, **all external contributions must come from a personal fork**.`,
                ``,
                `### How to contribute correctly`,
                ``,
                `1. **Fork** the repository to your own GitHub account:`,
                `   > https://github.com/${baseRepo}/fork`,
                ``,
                `2. **Clone your fork** locally:`,
                `   \`\`\`bash`,
                `   git clone https://github.com/${contributor}/${context.repo.repo}.git`,
                `   \`\`\``,
                ``,
                `3. **Create a branch** from \`develop\` following the naming convention:`,
                `   \`\`\`bash`,
                `   git checkout -b fix/your-description develop`,
                `   \`\`\``,
                ``,
                `4. **Commit with DCO sign-off** on every commit:`,
                `   \`\`\`bash`,
                `   git commit -s -m "fix(module): describe your change"`,
                `   \`\`\``,
                ``,
                `5. **Push to your fork** and open a PR targeting \`develop\`.`,
                ``,
                `Please review [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) for the complete guide.`,
                ``,
                `This PR has been closed automatically. We look forward to your fork-based contribution! 🙌`
              ].join("\n")
            });

            // Close the PR.
            await github.rest.pulls.update({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              pull_number: prNumber,
              state:       "closed"
            });

            core.notice(`PR #${prNumber} from upstream branch has been automatically closed.`);
